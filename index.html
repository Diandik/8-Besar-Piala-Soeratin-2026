            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(145deg, #0d1a0d, #1a3a1a);
            padding: 16px 12px 12px;
            text-align: center;
            border-bottom: 3px solid #F9A825;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(249, 168, 37, 0.05), transparent 60%);
            pointer-events: none;
        }

        .header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .header .logo-pssi {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(249, 168, 37, 0.3);
            padding: 4px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .header .logo-pssi img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(249, 168, 37, 0.15);
        }

        .header .sub {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
            color: #ffffff;
        }

        .slogan {
            background: linear-gradient(90deg, #F9A825, #f57f17);
            color: #0a0e17;
            font-weight: 800;
            padding: 5px 0;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px 16px 8px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .tab-btn {
            padding: 10px 32px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .tab-btn:hover {
            background: rgba(249, 168, 37, 0.1);
            border-color: rgba(249, 168, 37, 0.3);
        }

        .tab-btn.active {
            background: #F9A825;
            color: #0a0e17;
            border-color: #F9A825;
            box-shadow: 0 0 30px rgba(249, 168, 37, 0.2);
        }

        .tab-btn .badge-tab {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
        }

        .tab-btn.active .badge-tab {
            opacity: 1;
        }

        .content {
            max-width: 1100px;
            margin: 10px auto;
            padding: 0 16px 60px;
        }

        .card {
            background: linear-gradient(145deg, #141b2b, #1a2335);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            padding: 20px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(249, 168, 37, 0.2);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-title .badge {
            font-size: 11px;
            background: rgba(249, 168, 37, 0.15);
            color: #ffffff;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(249, 168, 37, 0.2);
        }

        /* ===== DETAIL PERTANDINGAN ===== */
        .match-detail-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }

        .match-detail-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .match-detail-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 4px 0 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .match-detail-header .match-label {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 12px;
            border-radius: 12px;
        }

        .match-detail-header .match-teams {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .match-detail-header .match-score {
            font-size: 20px;
            font-weight: 900;
            color: #F9A825;
            background: rgba(249, 168, 37, 0.08);
            padding: 2px 16px;
            border-radius: 8px;
        }

        .match-detail-body {
            display: grid;
            grid-template-columns: 1fr 30px 1fr;
            gap: 6px 8px;
            align-items: start;
        }

        .match-detail-body .team-col {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .match-detail-body .team-col.left {
            align-items: flex-end;
        }

        .match-detail-body .team-col.right {
            align-items: flex-start;
        }

        .match-detail-body .goal-item {
            font-size: 11px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .match-detail-body .goal-item .goal-balls {
            color: #F9A825;
            font-size: 11px;
        }

        .match-detail-body .goal-item .goal-number {
            color: #ffffff;
            font-size: 10px;
        }

        .match-detail-body .goal-item .goal-name {
            color: #e0e0e0;
            font-weight: 600;
            font-size: 11px;
        }

        .match-detail-body .goal-item .goal-og-label {
            color: #ef4444;
            font-size: 8px;
            font-weight: 700;
            background: rgba(239, 68, 68, 0.15);
            padding: 1px 5px;
            border-radius: 3px;
        }

        .match-detail-body .card-item {
            font-size: 11px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .match-detail-body .card-item .card-yellow {
            color: #F9A825;
            font-weight: 700;
        }

        .match-detail-body .card-item .card-red {
            color: #ef4444;
            font-weight: 700;
        }

        .match-detail-body .card-item .card-number {
            color: #ffffff;
            font-size: 10px;
        }

        .match-detail-body .card-item .card-name {
            color: #e0e0e0;
            font-weight: 600;
            font-size: 11px;
        }

        .match-detail-divider {
            color: #4b5563;
            font-size: 10px;
            text-align: center;
            padding-top: 8px;
        }

        .match-detail-empty {
            color: #4b5563;
            font-size: 11px;
            text-align: center;
            padding: 4px 0;
        }

        .detail-section-title {
            font-size: 15px;
            font-weight: 700;
            color: #F9A825;
            margin-top: 20px;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 4px solid #F9A825;
        }

        .top-skor-list {

            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 3px solid #F9A825;
            transition: 0.3s;
            flex-wrap: wrap;
            gap: 4px;

            color: #e0e0e0;
            font-size: 14px;

            font-weight: 700;
            margin-right: 8px;
            font-size: 13px;
        }

            text-align: center;
            color: #4b5563;
            padding: 20px 0;
            font-size: 14px;
        }

        .kartu-table {
            width: 100%;
            font-size: 12px;
            border-collapse: collapse;
            min-width: 280px;
            margin-top: 8px;
        }

            background: rgba(255, 255, 255, 0.05);
            padding: 8px 6px;
            text-align: center;
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;

            padding: 6px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            font-size: 12px;
            white-space: nowrap;

        }

            background: rgba(255, 255, 255, 0.02);
        }

            color: #9ca3af;
            font-size: 11px;

            text-align: left;
            font-weight: 600;
            color: #e0e0e0;
            font-size: 12px;

            color: #6b7280;
            font-size: 10px;
        }

            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            border: 1px solid rgba(249, 168, 37, 0.2);
            display: inline-block;

            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: inline-block;

            font-weight: 700;
            color: #F9A825;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 4px solid #F9A825;
        }

            text-align: center;
            padding: 16px 12px;
            font-size: 11px;
            color: #ffffff;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 16px;
        }

        .footer strong {
            color: #ffffff;
        }

        .bracket-container {
            transition: opacity 0.3s ease;
        }

        .bracket-container.fade {
            opacity: 0;
        }

        @media (max-width: 768px) {

            }

                font-size: 10px;
            }

            .match-detail-header .match-teams {

        // ============================================================
        // FUNGSI HITUNG TOP SKOR (dari kode kedua)
        // ============================================================

        function hitungTopSkor(pertandinganGrup) {
            const golMap = {};

            for (const g of Object.keys(pertandinganGrup)) {
                const matches = pertandinganGrup[g] || [];
                for (const match of matches) {
                    const gol = match.gol || [];
                    for (const g of gol) {
                        if (g.nama.includes('(OG)')) continue;
                        const key = `${g.nama}|${g.no}|${g.tim}`;
                        if (!golMap[key]) {
                            golMap[key] = { nama: g.nama, no: g.no, tim: g.tim, gol: 0 };
                        }
                        golMap[key].gol += 1;
                    }
                }
            }

            const result = Object.values(golMap);
            result.sort((a, b) => b.gol - a.gol);
            return result;
        }

        // ============================================================
        // FUNGSI RENDER DETAIL PERTANDINGAN
        // ============================================================

        function renderMatchDetail(match, kartu) {
            const skorTuan = match.skorTuan !== null ? match.skorTuan : '?';
            const skorTamu = match.skorTamu !== null ? match.skorTamu : '?';
            const isFinished = match.skorTuan !== null && match.skorTamu !== null;

            // Filter gol per tim
            const golTuan = (match.gol || []).filter(g => g.tim === match.tuan && !g.nama.includes('(OG)'));
            const golTuanOG = (match.gol || []).filter(g => g.tim === match.tuan && g.nama.includes('(OG)'));
            const golTamu = (match.gol || []).filter(g => g.tim === match.tamu && !g.nama.includes('(OG)'));
            const golTamuOG = (match.gol || []).filter(g => g.tim === match.tamu && g.nama.includes('(OG)'));

            // Filter kartu per tim
            const matchKey = `${match.tuan} vs ${match.tamu}`;
            const kartuTuan = kartu.filter(k => k.tim === match.tuan && k.pertandingan === matchKey);
            const kartuTamu = kartu.filter(k => k.tim === match.tamu && k.pertandingan === matchKey);

            function renderGol(golArray) {
                if (!golArray || golArray.length === 0) return '';
                const grouped = {};
                golArray.forEach(g => {
                    const key = `${g.nama}|${g.no}`;
                    if (!grouped[key]) {
                        grouped[key] = { nama: g.nama, no: g.no, count: 0 };
                    }
                    grouped[key].count += 1;
                });
                return Object.values(grouped).map(g => {
                    const balls = '⚽'.repeat(g.count);
                    return `
                        <span class="goal-item">
                            <span class="goal-balls">${balls}</span>
                            <span class="goal-number">${g.no}.</span>
                            <span class="goal-name">${g.nama}</span>
                        </span>
                    `;
                }).join('');
            }

            function renderGolOG(golArray) {
                if (!golArray || golArray.length === 0) return '';
                return golArray.map(g => {
                    const namaClean = g.nama.replace(' (OG)', '');
                    return `
                        <span class="goal-item">
                            <span class="goal-balls">⚽</span>
                            <span class="goal-number">${g.no}.</span>
                            <span class="goal-name">${namaClean}</span>
                            <span class="goal-og-label">OG</span>
                        </span>
                    `;
                }).join('');
            }

            function renderKartu(kartuArray) {
                if (!kartuArray || kartuArray.length === 0) return '';
                return kartuArray.map(k => {
                    const icon = k.kuning > 0 ? '🟨' : '🟥';
                    const cls = k.kuning > 0 ? 'card-yellow' : 'card-red';
                    return `
                        <span class="card-item">
                            <span class="${cls}">${icon}</span>
                            <span class="card-number">${k.no}.</span>
                            <span class="card-name">${k.nama}</span>
                        </span>
                    `;
                }).join('');
            }

            const adaGol = golTuan.length > 0 || golTamu.length > 0 || golTuanOG.length > 0 || golTamuOG.length > 0;
            const adaKartu = kartuTuan.length > 0 || kartuTamu.length > 0;

            return `
                <div class="match-detail-card">
                    <div class="match-detail-header">
                        <span class="match-label">${match.label}</span>
                        <span class="match-teams">${match.tuan} vs ${match.tamu}</span>
                        <span class="match-score">${skorTuan} - ${skorTamu}</span>
                        ${!isFinished ? '<span style="font-size:10px;color:#6b7280;">(Belum Main)</span>' : ''}
                    </div>

                    ${isFinished ? `
                    <div class="match-detail-body">
                        <div class="team-col left">
                            ${renderGol(golTuan)}
                            ${renderGolOG(golTuanOG)}
                            ${renderKartu(kartuTuan)}
                        </div>
                        <div class="match-detail-divider">⚡</div>
                        <div class="team-col right">
                            ${renderGol(golTamu)}
                            ${renderGolOG(golTamuOG)}
                            ${renderKartu(kartuTamu)}
                        </div>
                    </div>
                    ` : `
                    <div class="match-detail-empty">⏳ Pertandingan belum dimainkan</div>
                    `}
                </div>
            `;
        }

        // ============================================================
        // RENDER FUNGSI
        // ============================================================

        function renderTopSkor(container, pertandinganGrup) {
            if (!container) return;

            const topSkor = hitungTopSkor(pertandinganGrup);
            // Filter gol >= 2
            const filtered = topSkor.filter(item => item.gol >= 2);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="kosong">Belum ada pemain dengan minimal 2 gol</div>';
                return;
            }

            let html = '<div class="top-skor-list">';
            filtered.forEach((item, idx) => {
                html += `
                    <div class="top-skor-item">
                        <span>
                            <span class="rank">${idx + 1}.</span>
                            <span class="nama">${item.no}. ${item.nama}</span>
                            <span class="tim">(${item.tim})</span>
                        </span>
                        <span class="gol">${item.gol} Gol</span>
                    </div>
                `;
            });
            html += '</div>';

            container.innerHTML = html;
        }

        function renderKartu(container, kartu) {
            if (!container) return;

            if (!kartu || kartu.length === 0) {
                container.innerHTML = '<div class="kosong">Belum ada data kartu</div>';
                return;
            }

            let html = `
                <table class="kartu-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th style="text-align:left">Nama Pemain</th>
                            <th style="text-align:left">Tim</th>
                            <th>Kartu</th>
                            <th style="text-align:left">Pertandingan</th>
                        </tr>
                    </thead>

            kartu.forEach(item => {
                let kartuHtml = '';
                if (item.kuning > 0) {
                    kartuHtml += `<span class="badge-kuning">🟨 ${item.kuning}</span>`;

                if (item.merah > 0) {
                    kartuHtml += `<span class="badge-merah">🟥 ${item.merah}</span>`;
                }
                if (!kartuHtml) kartuHtml = '<span style="color:#4b5563;font-size:10px;">-</span>';

                html += `
                    <tr>
                        <td>${item.no}</td>
                        <td class="nama-cell">${item.nama}</td>
                        <td class="tim-cell">${item.tim}</td>
                        <td>${kartuHtml}</td>
                        <td class="pertandingan-cell">${item.pertandingan || '-'}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function renderAll(title, matchData, pertandinganData, kartu) {
            const container = document.getElementById('bracketContainer');
            const titleEl = document.getElementById('cardTitle');
            if (!container) return;

            // Update title
            if (titleEl) {
                titleEl.innerHTML = `
                    🏆 ${title}
                    <span class="badge">Perempat Final</span>
                `;
            }

            let html = '';

            // ===== DETAIL 8 BESAR =====
            html += `
                <div class="detail-section-title">📋 DETAIL HASIL 8 BESAR</div>
            `;
            matchData.quarter.forEach(match => {
                html += renderMatchDetail(match, kartu);
            });

            // ===== DETAIL SEMIFINAL =====
            html += `
                <div class="detail-section-title" style="margin-top:24px;">📋 DETAIL HASIL SEMIFINAL</div>
            `;
            matchData.semifinal.forEach(match => {
                html += renderMatchDetail(match, kartu);
            });

            // ===== DETAIL FINAL & 3-4 =====
            html += `
                <div class="detail-section-title" style="margin-top:24px;">📋 DETAIL HASIL FINAL</div>
            `;
            html += renderMatchDetail(matchData.final, kartu);
            html += renderMatchDetail(matchData.thirdPlace, kartu);

            // ===== TOP SKOR =====
            html += `
                <div class="sub-section-title">⚽ TOP SKOR (Minimal 2 Gol)</div>
                <div id="topSkorContainer"></div>
            `;

            // ===== KARTU =====
            html += `
                <div class="sub-section-title" style="margin-top:20px;">🟨🟥 KARTU</div>
                <div id="kartuContainer"></div>
            `;

            // Fade in animation
            container.classList.add('fade');
            container.innerHTML = html;
            setTimeout(() => {
                container.classList.remove('fade');
            }, 50);

            // Render Top Skor & Kartu setelah HTML dimasukkan
            const topSkorContainer = document.getElementById('topSkorContainer');
            const kartuContainer = document.getElementById('kartuContainer');

            if (topSkorContainer) {
                renderTopSkor(topSkorContainer, pertandinganData);
            }

            if (kartuContainer) {
                renderKartu(kartuContainer, kartu);
            }
        }

        let currentTab = 'u13';

        function switchTab(tab) {
            if (tab === currentTab) return;
            currentTab = tab;

            // Update tombol
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tab) {
                    btn.classList.add('active');
                }
            });

            // Render data sesuai tab
            if (tab === 'u13') {
                renderAll('8 BESAR U-13', matchDetailU13, pertandingan.u13, kartuData.u13);
            } else if (tab === 'u15') {
                renderAll('8 BESAR U-15', matchDetailU15, pertandingan.u15, kartuData.u15);
            }
        }
